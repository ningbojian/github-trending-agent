<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-label="数据流：抓取 → 入库 → 每小时快照 → 企微与邮箱双通道">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #656d76; }
      .flow { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .accent { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="920" height="560" fill="#f6f8fa"/>

  <!-- A: 抓取 -->
  <rect class="box" x="60" y="36" width="380" height="86" rx="10"/>
  <text class="t h" x="80" y="68">GitHub Actions · 每天 UTC 01:00</text>
  <text class="t s" x="80" y="92">抓取 Trending 榜单，GitHub API 补全 topics</text>

  <path class="flow" d="M250,122 L250,166"/>

  <!-- B: 入库 -->
  <rect class="box" x="60" y="170" width="380" height="86" rx="10"/>
  <text class="t h" x="80" y="202">Neon Postgres</text>
  <text class="t s" x="80" y="226">repos · trending_entries · subscribers</text>
  <text class="t s" x="80" y="246" font-size="11.5">email_subscribers · favorites · search_caches · kv_cache</text>

  <path class="flow" d="M250,256 L250,300"/>

  <!-- C: 快照 -->
  <rect class="accent" x="60" y="300" width="380" height="96" rx="10"/>
  <text class="t h" x="80" y="332">每小时 cron · /api/cron-push-digest</text>
  <text class="t s" x="80" y="356">构建当日快照：全局 20 + 每语言 15，</text>
  <text class="t s" x="80" y="378">中文简介与今日概览（一轮 LLM，落 kv_cache）</text>

  <!-- 分支箭头 -->
  <path class="flow" d="M440,340 L480,340 L480,332 L516,332"/>
  <path class="flow" d="M440,372 L480,372 L480,480 L516,480"/>

  <!-- D: 企微 -->
  <rect class="box" x="520" y="284" width="340" height="96" rx="10"/>
  <text class="t h" x="540" y="316">企微成员 + 微信插件（主线）</text>
  <text class="t s" x="540" y="340">个人微信里每天收简报、直接提问、</text>
  <text class="t s" x="540" y="362">收藏仓库并同步 star（不装企业微信）</text>

  <!-- E: 邮箱 -->
  <rect class="box" x="520" y="432" width="340" height="96" rx="10"/>
  <text class="t h" x="540" y="464">邮箱订阅（备用通道 · Resend）</text>
  <text class="t s" x="540" y="488">每天固定时间一封，不截断、可转发、</text>
  <text class="t s" x="540" y="510">双重确认 + 一键退订，不能对话</text>

  <!-- F: 落地页 -->
  <rect class="box" x="60" y="436" width="380" height="92" rx="10"/>
  <text class="t h" x="80" y="468">分享链接 · /api/join</text>
  <text class="t s" x="80" y="492">先企微、后邮箱；企微名额满时邮箱升为推荐，</text>
  <text class="t s" x="80" y="514">邮箱入口始终首屏可见</text>

  <path class="flow" d="M440,482 L516,482"/>
</svg>
