# 每日管线：抓取 GitHub Trending → 补全 topics → 兜底触发一次简报。
# 简报的正常触发是 digest-hourly.yml（每小时）；但 GitHub 的排程触发在本仓库实测
# 不可靠（每小时那条曾连续 17 小时零触发），所以这里补一次兜底。
# 不会重复发送：pushDigests 有三重门控——推送时间未到跳过、当天已发/未满间隔跳过、
# 抢占用原子条件 UPDATE。
# cron 30 0 * * * 为 UTC（= 北京时间 08:30）；也可 workflow_dispatch 手动跑抓取全链路。
name: 每日热榜管线

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    name: 抓取 → 补全
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 注意：src/config.ts 的 zod 校验要求全量必填变量——即便 scraper/enrich CLI
      # 只实际用到 NEON_DATABASE_URL 与 GITHUB_TOKEN，缺任一必填项都会在
      # `db()` 初始化时抛错并触发失败告警。未被本管线消费的必填项用下方
      # 占位字面量满足校验，避免把真实密钥暴露给 CI 作业（缩小泄露面）。
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # 可选：未配置时 enrich 步骤告警并跳过，不视为失败
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 以下仅用于通过 zod min(1) 校验，本管线不消费，故不用 secrets
      LLM_PROVIDER: "placeholder-not-used-in-ci"
      LLM_API_KEY: "placeholder-not-used-in-ci"
      LLM_MODEL: "placeholder-not-used-in-ci"
      # 以下为失败告警实际消费的真实 secrets
      WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
      WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
      WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
      # 可选：未配置时失败告警步骤跳过（仅打 warning）
      WECOM_ADMIN_USERID: ${{ secrets.WECOM_ADMIN_USERID }}
      # 可选：未配置时跳过兜底简报触发
      VERCEL_URL: ${{ secrets.VERCEL_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # 以下占位：OAuth/回调/加密密钥仅 Vercel 端点使用，绝不下放到 CI
      WECOM_CALLBACK_TOKEN: "placeholder-not-used-in-ci"
      WECOM_CALLBACK_AES_KEY: "placeholder-not-used-in-ci"
      GITHUB_CLIENT_ID: "placeholder-not-used-in-ci"
      GITHUB_CLIENT_SECRET: "placeholder-not-used-in-ci"
      GITHUB_OAUTH_REDIRECT_URI: "placeholder-not-used-in-ci"
      TOKEN_ENCRYPT_KEY: "placeholder-not-used-in-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 抓取 Trending 并入库
        run: npx tsx src/scraper/run-scraper.ts

      - name: 补全仓库 topics（GitHub API）
        run: npx tsx src/github/run-enrich.ts

      - name: 抓取多源榜单（HF / GitHub Search / HN / Lobsters）
        # 单个源失败不拖垮抓取/补全主链路；run-sources 内部已逐源隔离，
        # 只有全部源都失败或总条数为 0 才退出 1。
        continue-on-error: true
        run: npx tsx src/sources/run-sources.ts

      - name: 兜底触发一次简报推送
        if: env.VERCEL_URL != '' && env.CRON_SECRET != ''
        run: |
          CODE=$(curl -sS -o digest-resp.json -w "%{http_code}" -X POST "https://${VERCEL_URL}/api/cron-push-digest" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP ${CODE}"
          cat digest-resp.json; echo
          [ "${CODE}" = 200 ]

      - name: 失败告警到企业微信管理员
        if: failure() && env.WECOM_ADMIN_USERID != ''
        env:
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_ID: ${{ github.run_id }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=$(curl -sS "https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=${WECOM_CORP_ID}&corpsecret=${WECOM_SECRET}" | jq -r '.access_token // empty' || true)
          if [ -z "${TOKEN}" ]; then
            echo "::warning::获取企业微信 access_token 失败，跳过告警"
            exit 0
          fi
          # agentid 为自建应用 message/send 的必填字段；errcode 断言防止发送被静默拒绝
          RESP=$(curl -sS -X POST "https://qyapi.weixin.qq.com/cgi-bin/message/send?access_token=${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg touser "${WECOM_ADMIN_USERID}" \
              --arg agentid "${WECOM_AGENT_ID}" \
              --arg content "⚠️ GitHub Trending 每日管线失败：工作流 ${ALERT_WORKFLOW}，Run ID ${ALERT_RUN_ID}，详情 ${ALERT_RUN_URL}" \
              '{touser: $touser, agentid: ($agentid | tonumber), msgtype: "text", text: {content: $content}}')")
          echo "${RESP}"
          echo "${RESP}" | jq -e '.errcode == 0' > /dev/null || {
            echo "::error::企业微信告警发送失败：${RESP}"
            exit 1
          }

      - name: 未配置管理员时跳过告警
        if: failure() && env.WECOM_ADMIN_USERID == ''
        run: echo "::warning::WECOM_ADMIN_USERID 未配置，跳过失败告警"
