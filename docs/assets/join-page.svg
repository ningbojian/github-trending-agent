<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="落地页示意：企微卡在前并标推荐，邮箱入口始终可见">
  <defs>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .muted { fill: #656d76; }
      .accent { fill: #2563EB; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    </style>
    <linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="112" y1="150" x2="400" y2="380">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="760" height="620" fill="#f6f8fa"/>

  <!-- 页面容器 -->
  <rect class="card" x="60" y="24" width="640" height="560" rx="12"/>

  <!-- 品牌头 -->
  <rect x="60" y="24" width="640" height="80" rx="12" fill="#0B1220"/>
  <rect x="60" y="76" width="640" height="28" fill="#0B1220"/>
  <!-- 品牌图标（与 docs/assets/icon.svg 同一造型，40px） -->
  <g transform="translate(88,44) scale(0.078125)"><rect width="512" height="512" fill="#0B1220"/><g transform="rotate(-5 256 268)"><circle cx="256" cy="88" r="27" fill="#22D3EE" opacity="0.18"/><rect x="248" y="96" width="16" height="60" rx="8" fill="#3B82F6"/><circle cx="256" cy="88" r="19" fill="#22D3EE"/><path d="M176 348 L150 416 Q147 426 161 419 L246 378 Z" fill="url(#brandGrad)"/><rect x="112" y="150" width="288" height="230" rx="70" fill="url(#brandGrad)"/><circle cx="204" cy="252" r="29" fill="#ffffff"/><circle cx="308" cy="252" r="29" fill="#ffffff"/><circle cx="204" cy="259" r="13" fill="#0B1220"/><circle cx="308" cy="259" r="13" fill="#0B1220"/><path d="M214 316 Q256 342 298 316" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/></g></g>
  <text class="t" x="140" y="60" font-size="18" font-weight="700" style="fill:#ffffff">GitHub 热榜</text>
  <text class="t" x="140" y="80" font-size="12" style="fill:#b1bac4">每日简报</text>

  <text class="t" x="88" y="140" font-size="18" font-weight="700">订阅 GitHub 热榜简报</text>
  <text class="t muted" x="88" y="166" font-size="13.5">每天一份中文 GitHub 热榜简报，两个入口任选其一。</text>

  <!-- 企微卡（推荐） -->
  <rect class="card" x="88" y="190" width="584" height="206" rx="10"/>
  <rect x="88" y="190" width="4" height="206" fill="#2563EB"/>
  <text class="t" x="108" y="222" font-size="15.5" font-weight="700">在微信里每天收简报、随时提问</text>
  <rect x="430" y="206" width="56" height="22" rx="11" fill="#DBEAFE"/>
  <text class="t accent" x="458" y="221" font-size="11" font-weight="700" text-anchor="middle">推荐</text>

  <circle cx="118" cy="252" r="9" fill="#DBEAFE"/>
  <text class="t accent" x="118" y="256" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="138" y="256" font-size="12.5">扫码加入企业（是否审核取决于后台设置）。</text>

  <circle cx="118" cy="282" r="9" fill="#DBEAFE"/>
  <text class="t accent" x="118" y="286" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="138" y="286" font-size="12.5">在微信里按提示启用「企业微信插件」。</text>

  <circle cx="118" cy="312" r="9" fill="#DBEAFE"/>
  <text class="t accent" x="118" y="316" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="138" y="316" font-size="12.5">在插件会话里发一句「你好」，立即收到欢迎语和今日简报。</text>

  <text class="t muted" x="108" y="348" font-size="11.5">· 每天自动收到简报　· 直接在微信里提问、收藏仓库　· 无需下载企业微信</text>
  <line x1="108" y1="364" x2="652" y2="364" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="t muted" x="108" y="382" font-size="11.5">如果加入时提示名额已满或无法加入，可直接用邮箱订阅。</text>

  <!-- 邮箱卡 -->
  <rect class="card" x="88" y="412" width="584" height="118" rx="10"/>
  <text class="t" x="108" y="442" font-size="15.5" font-weight="700">只想收邮件？</text>
  <text class="t muted" x="108" y="464" font-size="12.5">· 不用加入企业，任何邮箱都行　· 每天固定时间一封，方便转发给同事</text>
  <rect x="108" y="480" width="132" height="32" rx="8" fill="#2563EB"/>
  <text class="t" x="174" y="501" font-size="13" font-weight="700" style="fill:#ffffff" text-anchor="middle">用邮箱订阅</text>

  <text class="t muted" x="380" y="566" font-size="11.5" text-anchor="middle">GitHub 热榜 · 非 GitHub 官方产品</text>
</svg>
