<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="落地页示意：企微卡在前并标推荐，邮箱入口始终可见">
  <defs>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .muted { fill: #656d76; }
      .green { fill: #1a7f37; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    </style>
    <linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="128" y1="148" x2="392" y2="392">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
  </defs>

  <rect width="760" height="620" fill="#f6f8fa"/>

  <!-- 页面容器 -->
  <rect class="card" x="60" y="24" width="640" height="560" rx="12"/>

  <!-- 品牌头 -->
  <rect x="60" y="24" width="640" height="80" rx="12" fill="#0d1117"/>
  <rect x="60" y="76" width="640" height="28" fill="#0d1117"/>
  <!-- 品牌图标（与 docs/assets/icon.svg 同一造型，40px） -->
  <g transform="translate(88,44) scale(0.078125)">
    <rect width="512" height="512" fill="#0d1117"/>
    <path d="M156 306 L156 386 Q156 408 176 398 L246 358 Z" fill="url(#brandGrad)"/>
    <rect x="96" y="136" width="320" height="232" rx="62" fill="url(#brandGrad)"/>
    <path d="M164 310 L228 244 L272 292 L314 240" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 188 L360 262 L282 210 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <text class="t" x="140" y="60" font-size="18" font-weight="700" style="fill:#ffffff">GitHub 热榜</text>
  <text class="t" x="140" y="80" font-size="12" style="fill:#b1bac4">每日简报</text>

  <text class="t" x="88" y="140" font-size="18" font-weight="700">订阅 GitHub 热榜简报</text>
  <text class="t muted" x="88" y="166" font-size="13.5">每天一份中文 GitHub 热榜简报，两个入口任选其一。</text>

  <!-- 企微卡（推荐） -->
  <rect class="card" x="88" y="190" width="584" height="206" rx="10"/>
  <rect x="88" y="190" width="4" height="206" fill="#1a7f37"/>
  <text class="t" x="108" y="222" font-size="15.5" font-weight="700">在微信里每天收简报、随时提问</text>
  <rect x="430" y="206" width="56" height="22" rx="11" fill="#dafbe1"/>
  <text class="t green" x="458" y="221" font-size="11" font-weight="700" text-anchor="middle">推荐</text>

  <circle cx="118" cy="252" r="9" fill="#dafbe1"/>
  <text class="t green" x="118" y="256" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="138" y="256" font-size="12.5">扫码加入企业（是否审核取决于后台设置）。</text>

  <circle cx="118" cy="282" r="9" fill="#dafbe1"/>
  <text class="t green" x="118" y="286" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="138" y="286" font-size="12.5">在微信里按提示启用「企业微信插件」。</text>

  <circle cx="118" cy="312" r="9" fill="#dafbe1"/>
  <text class="t green" x="118" y="316" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="138" y="316" font-size="12.5">在插件会话里发一句「你好」，立即收到欢迎语和今日简报。</text>

  <text class="t muted" x="108" y="348" font-size="11.5">· 每天自动收到简报　· 直接在微信里提问、收藏仓库　· 无需下载企业微信</text>
  <line x1="108" y1="364" x2="652" y2="364" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="t muted" x="108" y="382" font-size="11.5">如果加入时提示名额已满或无法加入，可直接用邮箱订阅。</text>

  <!-- 邮箱卡 -->
  <rect class="card" x="88" y="412" width="584" height="118" rx="10"/>
  <text class="t" x="108" y="442" font-size="15.5" font-weight="700">只想收邮件？</text>
  <text class="t muted" x="108" y="464" font-size="12.5">· 不用加入企业，任何邮箱都行　· 每天固定时间一封，方便转发给同事</text>
  <rect x="108" y="480" width="132" height="32" rx="8" fill="#1a7f37"/>
  <text class="t" x="174" y="501" font-size="13" font-weight="700" style="fill:#ffffff" text-anchor="middle">用邮箱订阅</text>

  <text class="t muted" x="380" y="566" font-size="11.5" text-anchor="middle">GitHub 热榜 · 非 GitHub 官方产品</text>
</svg>
