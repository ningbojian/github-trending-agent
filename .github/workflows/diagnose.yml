name: 临时诊断3（跑完即删）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 调用 _diag 端点
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          CODE=$(curl -sS -o probe-body.txt -w "%{http_code}" -m 60 "https://${VERCEL_URL}/api/_diag?token=${CRON_SECRET}")
          echo "HTTP ${CODE}"
          cat probe-body.txt; echo