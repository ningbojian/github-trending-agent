<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" viewBox="0 0 420 700" role="img" aria-label="个人微信里的聊天示意：欢迎语、每日简报、自然语言提问">
  <defs>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .msg { font-size: 12.5px; }
      .small { font-size: 11px; }
      .muted { fill: #656d76; }
      .bubble { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .mine { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1; }
    </style>
    <linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="128" y1="148" x2="392" y2="392">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <!-- 应用头像的圆角方形裁切（与微信里的显示一致） -->
    <clipPath id="av"><rect width="512" height="512" rx="64"/></clipPath>
  </defs>

  <rect width="420" height="700" fill="#f6f8fa"/>

  <!-- 手机框 -->
  <rect x="20" y="20" width="380" height="660" rx="30" fill="#ededed" stroke="#c9d1d9" stroke-width="1.5"/>

  <!-- 顶栏 -->
  <rect x="20" y="20" width="380" height="76" rx="30" fill="#0d1117"/>
  <rect x="20" y="58" width="380" height="38" fill="#0d1117"/>
  <text class="t" x="210" y="58" text-anchor="middle" font-size="16" font-weight="700" style="fill:#ffffff">GitHub 热榜</text>
  <text class="t" x="210" y="80" text-anchor="middle" font-size="11" style="fill:#b1bac4">微信插件 · 已置顶</text>

  <!-- 欢迎语 -->
  <g transform="translate(44,114) scale(0.05859375)" clip-path="url(#av)">
    <rect width="512" height="512" fill="#0d1117"/>
    <path d="M156 306 L156 386 Q156 408 176 398 L246 358 Z" fill="url(#brandGrad)"/>
    <rect x="96" y="136" width="320" height="232" rx="62" fill="url(#brandGrad)"/>
    <path d="M164 310 L228 244 L272 292 L314 240" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 188 L360 262 L282 210 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect class="bubble" x="80" y="112" width="274" height="142" rx="12"/>
  <text class="t msg" x="96" y="136">你好！我是 GitHub 热榜助手，</text>
  <text class="t msg" x="96" y="156">已为你自动开通每日简报</text>
  <text class="t msg" x="96" y="176">（默认每天 09:00 北京时间推送）。</text>
  <text class="t msg" x="96" y="200">发自然语言就能搜榜，例如</text>
  <text class="t msg" x="96" y="220">「本周 rust 的 ai 项目」。</text>
  <text class="t msg" x="96" y="240">发「帮助」查看全部指令。</text>

  <!-- 当日简报 -->
  <g transform="translate(44,272) scale(0.05859375)" clip-path="url(#av)">
    <rect width="512" height="512" fill="#0d1117"/>
    <path d="M156 306 L156 386 Q156 408 176 398 L246 358 Z" fill="url(#brandGrad)"/>
    <rect x="96" y="136" width="320" height="232" rx="62" fill="url(#brandGrad)"/>
    <path d="M164 310 L228 244 L272 292 L314 240" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 188 L360 262 L282 210 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect class="bubble" x="80" y="270" width="274" height="190" rx="12"/>
  <text class="t" x="96" y="296" font-size="13" font-weight="700">今日 GitHub 热榜 · 10-25</text>
  <text class="t small" x="96" y="322">1. openai/openai-python ★21.3k (+812)</text>
  <text class="t small muted" x="108" y="340">官方 Python SDK</text>
  <text class="t small" x="96" y="362">2. vercel/next.js ★128k (+430)</text>
  <text class="t small muted" x="108" y="380">React 全栈框架</text>
  <text class="t small" x="96" y="402">3. rust-lang/rust ★99.1k (+305)</text>
  <text class="t small muted" x="108" y="420">系统级编程语言</text>
  <text class="t small muted" x="96" y="444">回复「收藏 1」同步 star 到你的 GitHub</text>

  <!-- 用户提问 -->
  <rect class="mine" x="150" y="476" width="204" height="44" rx="12"/>
  <text class="t msg" x="336" y="502" text-anchor="end">本周 rust 的 ai 项目</text>

  <!-- 回复 -->
  <g transform="translate(44,538) scale(0.05859375)" clip-path="url(#av)">
    <rect width="512" height="512" fill="#0d1117"/>
    <path d="M156 306 L156 386 Q156 408 176 398 L246 358 Z" fill="url(#brandGrad)"/>
    <rect x="96" y="136" width="320" height="232" rx="62" fill="url(#brandGrad)"/>
    <path d="M164 310 L228 244 L272 292 L314 240" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 188 L360 262 L282 210 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect class="bubble" x="80" y="536" width="274" height="112" rx="12"/>
  <text class="t msg" x="96" y="560">本周 rust 榜里的 AI 项目：</text>
  <text class="t small" x="96" y="584">1. rust-lang/rust ★99.1k (+305)</text>
  <text class="t small" x="96" y="606">2. tauri-apps/tauri ★88.2k (+410)</text>
  <text class="t small muted" x="96" y="630">回复「收藏 1」即可收藏并同步 star</text>

  <text class="t small muted" x="210" y="666" text-anchor="middle">全程在微信内完成，无需安装企业微信</text>
</svg>
