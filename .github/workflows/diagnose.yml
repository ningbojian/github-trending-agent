name: 临时诊断3（跑完即删）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 调用 _diag 端点
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "===== /api/diag-temp ====="
          CODE=$(curl -sS -o probe-body.txt -w "%{http_code}" -m 60 "https://${VERCEL_URL}/api/diag-temp?token=${CRON_SECRET}")
          echo "HTTP ${CODE}"
          head -c 4000 probe-body.txt; echo
          echo "===== GET /api/cron-push-digest (sanity) ====="
          CODE=$(curl -sS -o probe-body2.txt -w "%{http_code}" -m 30 "https://${VERCEL_URL}/api/cron-push-digest")
          echo "HTTP ${CODE}"
          head -c 300 probe-body2.txt; echo